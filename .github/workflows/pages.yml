# Publishes the game to GitHub Pages.
#
# The repository's default branch has slashes in its name, which the classic
# "deploy from a branch" source handles inconsistently. Deploying through
# Actions instead makes the build explicit and visible: it works with any
# branch name, and when something breaks there are logs to read.
#
# To use this, set Settings -> Pages -> Source to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/one-piece-3d-game-prototype-71p064
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # There is no build step — the repository root is the site.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
